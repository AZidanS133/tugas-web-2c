<!DOCTYPE html>
<html>
<head>
    <title>Perulangan JavaScript</title>
</head>
<body>

    <script type="text/javascript">
      //perulangan for
        for( let i=1; i<=10; i++) {

            document.write('<p>Angka ke - '+i+'</p>');

        } 

    </script>


      <script type="text/javascript">

      //perulangan while
        var a=0;

        while(a<10) {

            document.write('<p>Tulisan ini diulang 10 kali</p>');

            a+=1;
        }
    </script>

  <script type="text/javascript">
    //perulangan do while
        let b=0;

        do {

            document.write('<p>Angka ke - '+b+'</p>');

            b+=1;

        } while(b<10);
    </script>

  <script type="text/javascript">
         // perulangan foreach
        document.write('<h2>Daftar Siswa</h2>');

        let siswa = ['ani', 'budi', 'sigit', 'faris'];

        siswa.forEach(function(i){
            document.write('<p>'+i+'</p>');
        });     

    </script>


</body>
</html>
