<!DOCTYPE html>
<html>
<head>
    <title>Operator Aritmatik</title>
</head>
<body>

  <h1>Tugas JavaScript Operator</h1>
    <script type="text/javascript">
        let a = 3;
        document.write('a = '+a+'<br>');
        let b = 2;
        document.write('b = '+b+'<br>');
        let c = 0;

        //penjumlahan
        c = a + b;
        document.write('a + b = '+c+'<br>');

        //pengurangan
        c = a - b;
        document.write('a - b = '+c+'<br>');

        //perkalian
        c = a * b;
        document.write('a * b = '+c+'<br>');

        //pembagian
        c = a / b;
        document.write('a / b = '+c+'<br>');

        //pemangkatan
        c = a ** b;
        document.write('a ** b = '+c+'<br>');

        //sisa bagi
        c = a % b;
        document.write('a % b = '+c+'<br>');

    </script>

  <h1>Tugas JavaScript Operator Penugasan</h1>

    <script type="text/javascript">
        let skor = 0;
        document.write('skor sekarang = '+skor+'<br>');

        //penambahan
        skor +=10;
        document.write('skor sekarang = '+skor+'<br>');

        //pengurangan
        skor -=5;
        document.write('skor sekarang = '+skor+'<br>');

        //perkalian
        skor *=10;
        document.write('skor sekarang = '+skor+'<br>');

        //pembagian
        skor /=5;
        document.write('skor sekarang = '+skor+'<br>');

        //pemangkatan
        skor **=2;
        document.write('skor sekarang = '+skor+'<br>');

        //sisa bagi
        skor %=2;
        document.write('skor sekarang = '+skor+'<br>');

    </script>


  <h1>Tugas JavaScript Operator Pembanding</h1>

    <script type="text/javascript">

        document.write('a = '+a+'<br>');
        document.write('b = '+b+'<br>');

        //sama dengan
        c = a == b;
        document.write('a == b = '+c+'<br>');

        //lebih besar
        c = a > b;
        document.write('a > b = '+c+'<br>');

        //lebih besar sama dengan
        c = a >= b;
        document.write('a >= b = '+c+'<br>');

        //kurang dari
        c = a < b;
        document.write('a < b = '+c+'<br>');

        //kurang dari sama dengan
        c = a <= b;
        document.write('a <= b = '+c+'<br>');

        //tidak sama dengan
        c = a != b;
        document.write('a != b = '+c+'<br>');

    </script>

   <h1>Tugas JavaScript Operator Logika</h1>

    <script type="text/javascript">

        document.write('a = '+a+'<br>');
        document.write('b = '+b+'<br>');

        //AND
        c = a && b;
        document.write('a AND b = '+c+'<br>');

        //OR
        c = a || b;
        document.write('a OR b = '+c+'<br>');

        //NOT
        c = !b;
        document.write('NOT b = '+c+'<br>');

    </script>

</body>
</html>
