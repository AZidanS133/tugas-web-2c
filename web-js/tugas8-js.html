<!DOCTYPE html>
<html>
<head>
    <title>Tugas 8 JavaScript</title>
</head>
<body>
 
    <script type="text/javascript">
         
        //fungsi salam
        function salam() {
            document.write('<h2>Assalamualaikum</h2>');
        }
 
        //memanggil fungsi
        salam();
 
    </script>

    <script type="text/javascript">
 
        //fungsi dengan parameter
        function tambah(a, b) {
            let c = a+b;
            return c
        }
 
        let penjumlahan=tambah(8,10);
        document.write('hasil dari penjumlahan 8 dan 10 adalah '+penjumlahan);
 
    </script>
 
</body>
</html>
