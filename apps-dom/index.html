<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Barang</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS buatan sendiri -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="card shadow-lg todo-card">
          <div class="card-body p-4">
            <h1 class="h3 fw-bold mb-1">Data Barang</h1>
            <p class="text-muted mb-4" id="ringkasan">Belum ada barang.</p>

            <!-- Form tambah barang -->
            <form id="form-tambah" class="input-group mb-4">
              <input type="text" id="input-barang" class="form-control"
                     placeholder="Tulis nama barang..." autocomplete="off" required>
              <button class="btn btn-success" type="submit">Tambah</button>
            </form>

            <!-- Daftar barang -->
            <ul id="daftar-barang" class="list-group"></ul>

            <p id="kosong" class="text-center text-muted mt-3 mb-0">
              Daftar masih kosong. Tambahkan barang pertamamu.
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- JavaScript buatan sendiri -->
  <script src="js/script.js"></script>
</body>
</html>
